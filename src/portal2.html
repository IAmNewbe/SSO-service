<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal S4RAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            display: flex;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            transition: width 0.3s;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 60px;
        }
        .sidebar.collapsed .sidebar-title {
            display: none;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px; /* Space between icon and title */
            padding: 5px 10px; /* Adjust padding for proper alignment */
            height: 50px; /* Ensures both items align vertically */
        }
        .sidebar-title {
            font-size: 19px; /* Make it the same height as the icon */
            font-weight: bold;
            color: #0056b3;
            margin: 0;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            color: black;
            font-weight: 500;
            font-size: 16px;
            transition: 0.3s;
        }
        .sidebar.collapsed a span {
            display: none;
        }
        .sidebar a:hover {
            background: #e8f0fe;
            border-radius: 5px;
        }
        .sidebar.collapsed .logout-btn {
            left: 50%;
            transform: translateX(-50%);
        }
        .toggle-btn {
            font-size: 24px;
            background: transparent;
            color: black;
            border: none;
            padding: 10px;
            cursor: pointer;
            padding: 5px; /* Reduce padding to match text */
            display: flex;
        }
        .content {
            margin-left: 270px;
            width: calc(100% - 270px);
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .user-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-card img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .user-card div {
            font-size: 14px;
        }
        .apps-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .apps-section h2 {
            font-size: 18px; /* Adjust this value as needed */
            font-weight: 600;
            margin-bottom: 10px;
        }
        .announcement h3 {
            font-size: 18px; /* Same as "Aplikasi dan Layanan" */
            font-weight: 600;
            margin-bottom: 10px;
        }
        .apps-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .apps-container a { 
            text-decoration: none;  /* Remove underline */
            color: inherit;         /* Keep default text color */
        }
        .app-card {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-card img {
            width: 40px;
            height: 40px;
        }
        .announcement {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .announcement-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            text-decoration: none; /* Remove default underline */
            color: inherit; /* Keep text color consistent */
        }
        .announcement-item:hover {
            background: #f4f7fc; /* Light hover effect */
        }
        .announcement-item img {
            width: 24px;
            height: 24px;
        }
        .btn {
            display: block;
            width: calc(100% - 20px);
            padding: 10px;
            text-align: center;
            background: #e8f0fe;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            color: black;
        }
        .logout-btn {
            position: absolute;
            bottom: 60px;
            left: 20px;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
    </style>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('collapsed');
            document.querySelector('.content').classList.toggle('collapsed');
        }
    </script>    
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <h2 class="sidebar-title">Portal S4RAS</h2>
        </div>        
        <a href="#">🏠 <span>Beranda</span></a>
        <a href="#">👤 <span>Akun</span></a>
        <a href="#">📢 <span>Pengumuman</span></a>
        <a href="logout.html" class="logout-btn">⏻ Logout</a>
    </div>
    <div class="content">
        <div class="apps-section">
        <h2>Aplikasi dan Layanan</h2>
        <div class="apps-container">
            <a href="classroom.html" class="app-card">
                <img src="classroom.png" alt="Classroom">
                <p>Classroom<br><small>Materi & Pembelajaran Online</small></p>
            </a>
            <a href="nexaplay.html" class="app-card">
                <img src="presensi.png" alt="NexaPlay">
                <p>NexaPlay<br><small>Video Streaming</small></p>
            </a>
            <a href="onecloud.html" class="app-card">
                <img src="thesis.png" alt="OneCloud">
                <p>OneCloud<br><small>Email & Storage</small></p>
            </a>
            <a href="chat.html" class="app-card">
                <img src="academic.png" alt="Chat">
                <p>Chat<br><small>VoIP Service</small></p>
            </a>
        </div>
    </div>

    <div class="announcement-section">    
        <div class="announcement">
            <h3>Pengumuman</h3>
            <a href="ucapan-ramadan.html" class="announcement-item">
                <img src="announcement.png" alt="icon">
                <p>Ucapan Ramadan</p>
            </a>
            <a href="beasiswa-vdmi-kse.html" class="announcement-item">
                <img src="announcement.png" alt="icon">
                <p>Beasiswa VDMI dan KSE</p>
            </a>
            <a href="lpda.html" class="announcement-item">
                <img src="announcement.png" alt="icon">
                <p>Lembaga Pengelola Dana Abadi (LPDA)</p>
            </a>
            <a href="#" class="btn">Lihat Semua Pengumuman</a>
        </div>
    </div>
</body>
</html>
